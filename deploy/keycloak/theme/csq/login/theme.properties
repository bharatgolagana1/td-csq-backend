# CSQ login theme: the landing page's look (dark, Archivo + IBM Plex Mono, the
# nose image, square buttons) on Keycloak's login, update-password, reset-
# password, error and info pages. Pages this theme does not override come from
# `base` and pick up the class names below, so they render in the same style.
parent=base
import=common/keycloak

styles=css/login.css
scripts=js/csq.js
meta=viewport==width=device-width,initial-scale=1 color-scheme==dark theme-color==#06090A

# Where the brand mark and the "csq.aero" link go. The landing page.
csqHomeUrl=https://dev.csq.aero/

kcHtmlClass=csq
kcBodyClass=csq-body
kcLoginClass=csq-page
kcHeaderClass=csq-header
kcHeaderWrapperClass=csq-header-wrap
kcFormCardClass=csq-card
kcFormHeaderClass=csq-card-head
kcContentWrapperClass=csq-content-wrap
kcFormClass=csq-form
kcFormGroupClass=csq-group
kcLabelClass=csq-label
kcLabelWrapperClass=csq-label-wrap
kcInputClass=csq-input
kcInputWrapperClass=csq-input-wrap
kcInputGroup=csq-input-group
kcInputErrorMessageClass=csq-field-error
kcFormPasswordVisibilityButtonClass=csq-eye
kcFormPasswordVisibilityIconShow=csq-icon-eye
kcFormPasswordVisibilityIconHide=csq-icon-eye-off
kcFormOptionsClass=csq-options
