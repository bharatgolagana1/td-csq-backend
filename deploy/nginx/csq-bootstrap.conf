# Temporary vhost for the first certificate issue only. csq.conf cannot be
# loaded before /etc/letsencrypt/live/{api,app}.dev.csq.aero exist (nginx
# refuses a missing ssl_certificate), so install this file first, run
# certbot with the webroot authenticator, then replace it with csq.conf.
# See deploy/README.md, "Certificates".

server {
    listen 80;
    listen [::]:80;
    server_name api.dev.csq.aero app.dev.csq.aero;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
