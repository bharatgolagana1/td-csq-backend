# Host nginx for the CSQ single-host layout: one hostname, three backends.
#
#   https://dev.csq.aero/         ->  127.0.0.1:8080  landing container (already on the box)
#   https://dev.csq.aero/app/     ->  127.0.0.1:8081  csq-web container (its own nginx, serves /app/)
#   https://dev.csq.aero/api/     ->  127.0.0.1:4000  csq-api container (/api/v1/…)
#   https://dev.csq.aero/healthz  ->  landing container (the uptime check this hostname already has)
#
# No new DNS names and no new certificates: the hostname and its certbot
# certificate are the ones the landing site already uses. This file REPLACES
# the vhost that serves dev.csq.aero today. Two `server` blocks with the same
# server_name do not error; nginx warns and keeps using the first one it
# loaded, so disable the old file when installing this one (deploy/README.md,
# "First deploy", step 7). The earlier two-hostname layout is csq.conf.
#
# Check before installing (step 7 shows the commands):
#   - the landing container really listens on 127.0.0.1:8080 (`docker ps`);
#   - the certificate paths below match `certbot certificates`;
#   - the existing certificate renews through the webroot used on port 80
#     here, or keep the old renewal mechanism instead.
#
# `listen 443 ssl http2` is the spelling that works on every nginx from 1.18
# to current (1.25+ prefers a separate `http2 on;`, and only warns).

upstream csq_landing {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream csq_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream csq_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# ---- port 80: ACME challenges, everything else to https ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.csq.aero;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- dev.csq.aero -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.csq.aero;

    ssl_certificate     /etc/letsencrypt/live/dev.csq.aero/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.csq.aero/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:csq_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/csq.access.log;
    error_log  /var/log/nginx/csq.error.log;

    # CSV imports are capped at 5 MB by the API (multer) and JSON at 2 MB;
    # 10 MB leaves room for multipart overhead without inviting abuse.
    client_max_body_size 10m;

    # Only HSTS is added here. Cache-Control, CSP and the other security
    # headers come from the containers and pass through untouched; CORS is
    # the API's job (CORS_ORIGINS), so the two never disagree.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Shared by every proxied location below (a location that sets no
    # proxy_set_header of its own inherits all of these). The API runs
    # express `trust proxy 1`: exactly this one hop.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---- API: /api/v1/… is passed through unchanged (no URI part on
    # proxy_pass, so nothing is rewritten).
    location /api/ {
        proxy_pass http://csq_api;
    }

    # ---- web app. The container serves /app/… itself: SPA fallback,
    # immutable /app/assets/, no-cache index.html, /app/healthz.
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://csq_web;
        proxy_read_timeout 30s;
    }

    # ---- landing site: everything else, including /healthz and
    # /favicon.ico, exactly as before this file existed.
    location = /healthz {
        access_log off;
        proxy_pass http://csq_landing;
    }

    location / {
        proxy_pass http://csq_landing;
    }
}
