# Host nginx on the EC2 box. Terminates TLS, then proxies to containers bound
# on loopback only. Certificates from certbot; see deploy/README.md.
#
# Containers must publish to 127.0.0.1 (-p 127.0.0.1:8080:8080), never 0.0.0.0,
# or the security group is the only thing standing between the internet and an
# unauthenticated origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# rate limit keyed on client IP, applied to the API only
limit_req_zone $binary_remote_addr zone=csq_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dev.csq.aero api.dev.csq.aero;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------- landing site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.csq.aero;

    ssl_certificate     /etc/letsencrypt/live/dev.csq.aero/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.csq.aero/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------- api
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.dev.csq.aero;

    ssl_certificate     /etc/letsencrypt/live/api.dev.csq.aero/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.csq.aero/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    # bulk customer import is the largest legitimate upload
    client_max_body_size 10m;

    location / {
        limit_req zone=csq_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # assessment submits and bulk imports are slower than a page load
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:4000/healthz;
    }
}
