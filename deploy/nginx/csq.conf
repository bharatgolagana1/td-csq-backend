# Host nginx for the CSQ TWO-HOSTNAME layout (not the one in use):
#
#   api.dev.csq.aero  ->  127.0.0.1:4000  (csq-api container)
#   app.dev.csq.aero  ->  127.0.0.1:8080  (csq-web container, its own nginx)
#
# The box runs the single-host layout instead (csq-single-host.conf: one
# hostname, /app/ and /api/ beside the landing site), which needs no DNS or
# certificate work. Keep this file only for a future move to separate
# hostnames; it then needs two DNS records, two certificates, the web image
# built with VITE_BASE_PATH=/ (and its deploy/nginx/nginx.conf changed to
# serve / instead of /app/), the web container published on 8080, and
# PUBLIC_WEB_URL / CORS_ORIGINS pointing at app.dev.csq.aero. See
# deploy/README.md, "Which nginx file".
#
# dev.csq.aero (the landing site) is a separate vhost that already exists on
# this box and is deliberately not defined here. Install this file as
# /etc/nginx/sites-available/csq.conf + symlink in sites-enabled (Debian /
# Ubuntu) or as /etc/nginx/conf.d/csq.conf, then `nginx -t && systemctl
# reload nginx`. Certificates come from certbot's webroot authenticator; for
# the very first issue, before these files exist, use csq-bootstrap.conf
# (deploy/README.md, "Certificates").
#
# `listen 443 ssl http2` is the spelling that works on every nginx from 1.18
# to current (1.25+ prefers a separate `http2 on;`, and only warns).

upstream csq_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream csq_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---- port 80: ACME challenges, everything else to https ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.dev.csq.aero app.dev.csq.aero;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- api.dev.csq.aero -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dev.csq.aero;

    ssl_certificate     /etc/letsencrypt/live/api.dev.csq.aero/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.csq.aero/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:csq_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/csq-api.access.log;
    error_log  /var/log/nginx/csq-api.error.log;

    # CSV imports are capped at 5 MB by the API (multer) and JSON at 2 MB;
    # 10 MB leaves room for multipart overhead without inviting abuse.
    client_max_body_size 10m;

    # CORS is the API's job (CORS_ORIGINS); nothing is added here so the two
    # never disagree.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://csq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API runs express `trust proxy 1`: exactly this one hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ---- app.dev.csq.aero -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.dev.csq.aero;

    ssl_certificate     /etc/letsencrypt/live/app.dev.csq.aero/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dev.csq.aero/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:csq_ssl:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/csq-web.access.log;
    error_log  /var/log/nginx/csq-web.error.log;

    client_max_body_size 10m;

    # Cache-Control, CSP and the other security headers are set by the
    # container's nginx and pass through untouched; only HSTS, which needs
    # to know about TLS, is added here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://csq_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
