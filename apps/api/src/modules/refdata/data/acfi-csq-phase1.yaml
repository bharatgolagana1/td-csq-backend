# The ACFI Cargo Service Quality instrument, Phase 1.
#
# Transcribed from the two published survey forms:
#   01_CSQ Survey Form (International).pdf   5 printed sections, 27 parameters
#   02_CSQ Survey Form (Domestic).pdf        4 printed sections, 23 parameters
#
# The 23 parameters of the domestic form are the shared core: 8 infrastructure,
# 6 security and safety, 5 process, 4 trade facilitation. The international form
# asks those same 23 and adds 4 more that only exist where customs does:
# EDI and SWIFT connectivity, disposal of uncleared cargo, customs officers on
# site, and airline and PGA offices on site. Dropping those four would mean the
# international assessment scored a domestic instrument.
#
# Conventions in this file
#
#   code         ordinal free, ACFI.<head>.<parameter>. The printed number is
#                NOT part of it: the international form numbers trade
#                facilitation as section 5 and the domestic form numbers it 4,
#                so a code built from the printed number names two different
#                parameters depending on which sheet it was read from.
#   formRef      the printed number, per form. Display only.
#   text         the wording the forms share. Where they differ, the
#                international wording, which is the longer one.
#   textByScope  the exact wording of a form that words the parameter
#                differently. Only present where the printed forms differ.
#   scopes       which printed form the parameter appears on.
#
# The printed forms carry a 1 to 10 column. CSQ renders this same question text
# on the five point scale plus NA; see packages/contracts/src/rating.ts. The
# scale is not a property of the bank.

bank:
  code: ACFI_CSQ
  title: ACFI Cargo Service Quality assessment
  description: >-
    The Air Cargo Forum India customer satisfaction instrument for air cargo
    terminal operators, as published for the international and domestic forms.
  sourceDocuments:
    - 01_CSQ Survey Form (International).pdf
    - 02_CSQ Survey Form (Domestic).pdf

notes: >-
  Phase 1. Transcribed from the published ACFI forms with no rewording.

questions:
  - code: ACFI.INFRA.CARGO_STORAGE_CAPACITY
    categoryCode: INFRA
    scopes: [INTERNATIONAL, DOMESTIC]
    answerType: RATING_5
    scored: true
    formRef: { INTERNATIONAL: "1.1", DOMESTIC: "1.1" }
    text: >-
      Availability of adequate cargo infrastructure/ storage areas/warehouse for
      safe/secured handling of cargo.

  - code: ACFI.INFRA.USER_AMENITIES
