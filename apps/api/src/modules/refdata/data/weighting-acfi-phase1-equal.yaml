# Equal weighting for the ACFI Phase 1 instrument.
#
# ACFI has not published differential weights. EQUAL records that as a fact
# about the standard rather than as an absence: every head counts the same,
# and every parameter counts the same within its head. When ACFI agrees a
# differential set, it arrives as a new profile version with basis CONFIGURED
# and the scores it produces say which profile produced them.
#
# Derivation, reproducible from the bank file:
#   categories   10000 / 4 = 2500 each, on both forms
#   questions    10000 / (parameters in that head on that form), largest
#                remainder to the earlier codes where the division is not
#                exact, so each head totals exactly 10000 rather than 9996
#
# The two forms carry different question sets, so they carry different
# tables. The international form asks 27 parameters and the domestic 23.

profile:
  code: ACFI_PHASE1_EQUAL
  title: ACFI Phase 1, equal weighting
  basis: EQUAL
  notes: >-
    Equal weights within and across heads. No differential weighting has been
    agreed by ACFI for Phase 1.

weights:
  INTERNATIONAL:
