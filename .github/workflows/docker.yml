# Builds the API image on every push to main and publishes it to GitHub's
# registry, so a deployment only pulls: the box never needs the RAM or the
# toolchain to build. Tags: the commit SHA (for rollback) and `latest`.
name: docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/csq-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/csq-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
