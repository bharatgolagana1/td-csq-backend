# The four Phase 1 assessment heads, taken from the ACFI survey forms.
#
# The international form prints five numbered sections and the domestic form
# prints four. Section 4 of the international form, "Availability of Regulatory
# & Facilitating Agency", is not a fifth head: the domestic form files the same
# parameter (banks and ATMs) under trade facilitation, which is where customs
# availability, airline offices and PGA offices belong too. Folding it in is
# what makes one set of heads serve both forms, and it is the reason question
# codes carry no section number.
#
# Source: 01_CSQ Survey Form (International).pdf, 02_CSQ Survey Form (Domestic).pdf

- code: INFRA
  name: Infrastructure and facilities
  displayOrder: 10
  description: >-
    Cargo infrastructure, storage, handling equipment, weighing and the charge
    and delivery paperwork that moves cargo through the terminal.

- code: SEC
  name: Security and safety
  displayOrder: 20
  description: >-
    Screening, security manpower, access control, surveillance, fire readiness
    and the signage that special cargo depends on.

- code: PROC
  name: Processes
  displayOrder: 30
  description: >-
    The IT system, slot allotment, unitisation, published procedures and the
    manpower deployed against them.

- code: TRADE
  name: Trade facilitation
  displayOrder: 40
  description: >-
    Grievance redressal, the agencies and banking available on site, incident
    investigation, and the overall experience of dealing with the operator.
